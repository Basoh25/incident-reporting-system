<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Dashboard - Incident Reporting System</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="dashboard-body">
    <header class="topbar">
        <h1>Incident Reporting System</h1>
        <div>
            <span id="userLabel"></span>
            <button id="logoutBtn">Log Out</button>
        </div>
    </header>

    <main class="dashboard-main">
        <section class="report-form-section">
            <h2>Report a Suspicious Activity</h2>
            <form id="reportForm">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" minlength="5" maxlength="150" required>

                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="phishing">Phishing</option>
                    <option value="malware">Malware</option>
                    <option value="unauthorized_access">Unauthorized Access</option>
                    <option value="data_leak">Data Leak</option>
                    <option value="policy_violation">Policy Violation</option>
                    <option value="other">Other</option>
                </select>

                <label for="severity">Severity</label>
                <select id="severity" name="severity" required>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                    <option value="critical">Critical</option>
                </select>

                <label for="description">Description</label>
                <textarea id="description" name="description" rows="5" minlength="10" required></textarea>

                <label for="reporter_phone">Your Phone Number</label>
                <input type="tel" id="reporter_phone" name="reporter_phone" placeholder="e.g. 0712345678" required>

                <label for="reporter_national_id">Your National ID / Passport Number</label>
                <input type="text" id="reporter_national_id" name="reporter_national_id" required>

                <label for="location">Location / Place of Incident (optional)</label>
                <input type="text" id="location" name="location" maxlength="150" placeholder="e.g. Office 3rd floor, Parking lot">

                <label for="reporter_gender">Gender (optional)</label>
                <select id="reporter_gender" name="reporter_gender">
                    <option value="">Prefer not to say</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>

                <label for="reporter_age">Age (optional)</label>
                <input type="number" id="reporter_age" name="reporter_age" min="1" max="120">

                <button type="submit">Submit Report</button>
            </form>
            <p id="formMessage"></p>
        </section>

        <section class="my-reports-section">
            <h2>My Reports</h2>
            <table id="reportsTable">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Severity</th>
                        <th>Status</th>
                        <th>Reported</th>
                    </tr>
                </thead>
                <tbody id="reportsBody">
                    <!-- filled by JS -->
                </tbody>
            </table>
        </section>
    </main>

    <script src="/js/dashboard.js"></script>
</body>
</html>
